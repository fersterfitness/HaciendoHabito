# Verificación en cada push y pull request: tipos, lint, tests y build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores de ejemplo: el build no se conecta a Supabase.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npx tsc -b
      - name: Lint
        run: npx eslint . --max-warnings=200
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npx vite build
      - name: Dependencias (producción)
        run: npm audit --omit=dev --audit-level=critical
